
name: F08 RTL and Physical Design CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Compile RTL and instructor testbench
        run: |
          iverilog -g2012 -gassertions -s f08_tb \
            -o /tmp/f08_tb.vvp \
            04_IMPLEMENTATION/rtl/f08_stepper_ctrl.sv \
            05_VERIFICATION/testbench/f08_tb.sv

      - name: Run RTL testbench
        run: vvp /tmp/f08_tb.vvp

      - name: Run Yosys synthesis
        run: yosys -s 04_IMPLEMENTATION/scripts/run_yosys.ys

      - name: Upload RTL and synthesis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-rtl-reports
          path: |
            04_IMPLEMENTATION/reports/yosys_synthesis.log
            05_VERIFICATION/logs/rtl_simulation.log
          if-no-files-found: warn

  librelane:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LibreLane
        run: python -m pip install librelane==3.0.17

      - name: Run LibreLane physical design
        run: |
          python -m librelane \
            --dockerized \
            --run-tag "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            04_IMPLEMENTATION/librelane_design/config.json

      - name: Upload LibreLane results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f08-librelane-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            04_IMPLEMENTATION/librelane_design/runs/
          if-no-files-found: warn
          retention-days: 14
